%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/ingenic,phy-usb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic SoCs USB PHY

maintainers:
  - Paul Cercueil <paul@crapouillou.net>
  - 周琰杰 (Zhou Yanjie) <zhouyanjie@wanyeetech.com>

properties:
  $nodename:
    pattern: '^usb-phy@.*'

  compatible:
    enum:
      - ingenic,jz4770-phy
      - ingenic,jz4775-phy
      - ingenic,jz4780-phy
      - ingenic,x1000-phy
      - ingenic,x1830-phy
      - ingenic,x2000-phy
      - ingenic,x2600-phy

  reg:
    minItems: 1
    items:
      - description: USBPCR and the registers following it
      - description: USBPCR1, where it does not follow them
      - description: The PHY's own (analog) registers

  clocks:
    minItems: 1
    items:
      - description: The PHY's clock
      - description:
          The bus clock of the PHY's USB controller, without which the
          PHY's own registers do not respond

  clock-names:
    items:
      - const: phy
      - const: bus

  ingenic,external-vbus-detect:
    type: boolean
    description:
      VBUS is detected outside the PHY, so its VBUS comparator is powered
      down.

  vcc-supply:
    description: VCC power supply

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - vcc-supply
  - '#phy-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: ingenic,x2600-phy
    then:
      properties:
        reg:
          minItems: 3
        clocks:
          minItems: 2
      required:
        - clock-names
    else:
      properties:
        reg:
          maxItems: 1
        clocks:
          maxItems: 1
        clock-names: false
        ingenic,external-vbus-detect: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,jz4770-cgu.h>
    otg_phy: usb-phy@3c {
      compatible = "ingenic,jz4770-phy";
      reg = <0x3c 0x10>;

      vcc-supply = <&vcc>;
      clocks = <&cgu JZ4770_CLK_OTG_PHY>;

      #phy-cells = <0>;
    };
  - |
    #include <dt-bindings/clock/ingenic,x2600-cgu.h>
    usb_phy: usb-phy@4c {
      compatible = "ingenic,x2600-phy";
      reg = <0x4c 0x8>, <0xe8 0x4>, <0x78400 0x100>;

      vcc-supply = <&vcc>;
      clocks = <&cgu X2600_CLK_USBPHY>, <&cgu X2600_CLK_USB>;
      clock-names = "phy", "bus";

      #phy-cells = <0>;
    };
